name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, migrations, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fz
          POSTGRES_PASSWORD: fz
          POSTGRES_DB: fantasticzone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fz -d fantasticzone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fz:fz@localhost:5432/fantasticzone
      SHADOW_DATABASE_URL: postgresql://fz:fz@localhost:5432/fantasticzone_shadow
      TEST_DATABASE_URL: postgresql://fz:fz@localhost:5432/fantasticzone_test
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:3000
      CURRENCY: NGN
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create test and shadow databases
        run: |
          PGPASSWORD=fz psql -h localhost -U fz -d fantasticzone \
            -c "CREATE DATABASE fantasticzone_test" \
            -c "CREATE DATABASE fantasticzone_shadow"

      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migrations apply cleanly to an empty database
        run: npx prisma migrate deploy

      - name: Migration check (schema.prisma has no unmigrated changes)
        run: npm run db:check

      - name: Seed runs
        run: npx prisma db seed

      - name: Tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E (preorder, allocation approval, invoice payment)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fz
          POSTGRES_PASSWORD: fz
          POSTGRES_DB: fantasticzone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fz -d fantasticzone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fz:fz@localhost:5432/fantasticzone
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:3100
      CURRENCY: NGN
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      # Playwright seeds the database, starts a fake Paystack and runs `next start` itself.
      - name: E2E
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
